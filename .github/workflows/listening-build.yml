name: Listening pilot application build
on:
  pull_request:
    branches: [place-exp/h-closure]
permissions:
  contents: read
concurrency:
  group: listening-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nextjs_space
    env:
      PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
      DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:5432/unused
      NEXTAUTH_SECRET: isolated-ci-build-no-production-access
      AUTH_SECRET: isolated-ci-build-no-production-access
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing portable dependency configuration
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
          rm -f yarn.lock
          cp ci/yarn.lock yarn.lock
          cat > .yarnrc.yml <<'YARNRC'
          enableGlobalCache: false
          enableTelemetry: false
          nodeLinker: node-modules
          YARNRC
      - name: Install existing locked dependencies
        run: yarn install --immutable
      - name: Generate isolated client without database access
        run: |
          node <<'JS'
          const fs = require('fs')
          const path = require('path')
          const schema = fs.readFileSync('prisma/schema.prisma','utf8').replace(/output\s*=\s*"[^"]*"/, 'output = '+JSON.stringify(path.join(process.cwd(),'node_modules/.prisma/client')))
          fs.writeFileSync('ci-schema.prisma',schema)
          JS
          yarn prisma generate --schema ci-schema.prisma
          rm ci-schema.prisma
      - name: Full TypeScript
        run: yarn typecheck
      - name: Listening and account journeys
        run: |
          node --test tests/listening-pilot.test.mjs tests/signup-acceptance.test.mjs tests/auth-journey-ui.test.mjs
          yarn test:account-recovery
      - name: Production build with pilot enabled
        env:
          LISTENING_PILOT_ENABLED: 'true'
        run: yarn build

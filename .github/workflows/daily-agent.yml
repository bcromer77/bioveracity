name: Northern Ireland daily staging
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['collectors/**', 'tests/**', '.github/workflows/daily-agent.yml']
permissions:
  contents: read
concurrency:
  group: ni-nightly-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: false
jobs:
  nightly:
    # Activation requires the account owner to confirm included Actions capacity
    # and a stop-spending budget. A workflow cannot enforce the account bill.
    if: github.event_name == 'pull_request' || vars.NI_NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline collector tests (no paid services)
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/ni-state
          key: ni-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ni-state-v1-${{ github.ref_name }}-
      - name: Bounded refresh for all 11 councils
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: python -m collectors.ni_nightly --state "$RUNNER_TEMP/ni-state" --output "$RUNNER_TEMP/ni-report"
      - uses: actions/cache/save@v4
        if: always() && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/ni-state
          key: ni-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: northern-ireland-coverage
          path: ${{ runner.temp }}/ni-report
          retention-days: 3
          if-no-files-found: warn

name: Luogo observation contract

on:
  pull_request:
    paths:
      - 'nextjs_space/lib/observations/**'
      - 'nextjs_space/tests/observation-contract.test.ts'
      - '.github/workflows/luogo-observation-contract.yml'
  workflow_dispatch:

jobs:
  observation-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs_space
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      # The current integration base does not track a package-lock.json, so npm ci
      # and setup-node dependency caching are not valid here. Install without
      # modifying repository files in CI; restoring a lockfile is a separate
      # repository-wide dependency-management decision.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test tests/observation-contract.test.ts
      - run: npm run typecheck

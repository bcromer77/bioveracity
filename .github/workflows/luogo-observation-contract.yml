name: Luogo observation contract

on:
  pull_request:
    paths:
      - 'nextjs_space/lib/observations/**'
      - 'nextjs_space/tests/observation-contract.test.ts'
      - '.github/workflows/luogo-observation-contract.yml'
  workflow_dispatch:

jobs:
  observation-contract:
    runs-on: ubuntu-latest
    env:
      PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
    defaults:
      run:
        working-directory: nextjs_space
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Prepare portable dependency configuration
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Generate an isolated Prisma client without connecting to a database
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const schema = fs.readFileSync('prisma/schema.prisma','utf8')
            .replace(/output\s*=\s*"[^"]*"/, 'output = '+JSON.stringify(path.join(process.cwd(),'node_modules/.prisma/client')))
          fs.writeFileSync('ci-schema.prisma', schema)
          NODE
          yarn prisma generate --schema ci-schema.prisma
          rm ci-schema.prisma
      - name: Luogo observation contract tests
        run: node --import tsx --test tests/observation-contract.test.ts
      - name: Full TypeScript check
        run: yarn typecheck
